server {
    listen 80;
    server_name cs50anzali.ir www.cs50anzali.ir;

    access_log /var/log/nginx/cs50hub_access.log;
    error_log /var/log/nginx/cs50hub_error.log;

    # Serve static files directly via Nginx (30-day cache)
    location /static/ {
        alias /var/www/cs50hub/flask-app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy all other requests to Gunicorn
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
