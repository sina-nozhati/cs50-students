server {
    listen 80;
    server_name cs50xanzali.ir www.cs50xanzali.ir cs50anzali.ir www.cs50anzali.ir;

    access_log /var/log/nginx/cs50hub_access.log;
    error_log /var/log/nginx/cs50hub_error.log;

    # فایل‌های دانلودی خصوصی‌اند — فقط از روت Flask با لاگین سرو شوند.
    # هرگز /static/downloads را مستقیم از Nginx سرو نکنید.
    location ^~ /static/downloads/ {
        internal;
        return 404;
    }

    # بقیهٔ static (تصاویر، CSS محلی) با کش ۳۰ روزه
    location /static/ {
        alias /var/www/cs50hub/flask-app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy all other requests to Gunicorn
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
