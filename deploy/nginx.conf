upstream cs50hub_backend {
    server 127.0.0.1:5000;
}

server {
    listen 80;
    server_name cs50xanzali.ir www.cs50xanzali.ir;

    access_log /var/log/nginx/cs50hub_access.log;
    error_log /var/log/nginx/cs50hub_error.log;

    # ─── فشرده‌سازی مدرن Gzip (کاهش ۷۰٪ تا ۸۰٪ حجم ترافیک) ──────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # فایل‌های دانلودی خصوصی‌اند — فقط از روت Flask با لاگین سرو شوند.
    # هرگز /static/downloads را مستقیم از Nginx سرو نکنید.
    location ^~ /static/downloads/ {
        internal;
        return 404;
    }

    # ─── سرو فایل‌های استاتیک محلی با کش طولانی مرورگر (۳۰ روزه) ──
    location /static/ {
        alias /var/www/cs50hub/flask-app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # ─── پروکسی پایدار به Gunicorn با بافرینگ بهینه ─
    location / {
        proxy_pass http://cs50hub_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # بافرینگ برای عدم بلاک شدن ورکرهای Gunicorn توسط کلاینت‌های کند اینترنت ایران
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_buffer_size 32k;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
