<?xml version="1.0" encoding="UTF-8"?>
<!--
  لوگوی Anzali CS50x — الهام‌گرفته از سپر Veritas دانشگاه هاروارد.
  این یک بازطراحی استایل‌شده است (نه کپی دقیق) تا هم حس آکادمیک هاروارد را بدهد
  و هم مالکیت پروژه‌ی انزلی باشد. رنگ اصلی Harvard Crimson (#A51C30) است.

  عناصر:
    - سپر (shield) با حاشیه‌ی طلایی
    - سه کتاب (Veritas = حقیقت) باز
    - شش ستاره روی کتاب‌ها
    - نوار VERITAS در پایین
  طراحی ساده و خوانا در اندازه‌های کوچک (favicon، navbar، کارت).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Anzali CS50x — سپر Veritas">
  <defs>
    <!-- سایه‌ی نرم زیر سپر -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#3a0a12" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ─── سپر (shield) ─── -->
  <!-- شکل سپر: بالا مستطیل، پایین منحنی به یک نقطه -->
  <path d="M32 4 L56 11 L56 30 C56 45 46 55 32 60 C18 55 8 45 8 30 L8 11 Z"
        fill="#A51C30" stroke="#C9A227" stroke-width="2" filter="url(#softShadow)"/>

  <!-- حاشیه‌ی داخلی روشن‌تر برای عمق -->
  <path d="M32 7 L53 13 L53 30 C53 43 44 52 32 56 C20 52 11 43 11 30 L11 13 Z"
        fill="none" stroke="#FFFFFF" stroke-width="0.6" opacity="0.35"/>

  <!-- ─── شش ستاره روی کتاب‌ها (نماد Veritas) ─── -->
  <g fill="#F4E4BC">
    <!-- ردیف بالا: ۳ ستاره -->
    <path d="M22 22 l0.9 1.9 2.1 0.3 -1.5 1.5 0.35 2.1 -1.9 -1 -1.9 1 0.35 -2.1 -1.5 -1.5 2.1 -0.3 z"/>
    <path d="M32 20 l0.9 1.9 2.1 0.3 -1.5 1.5 0.35 2.1 -1.9 -1 -1.9 1 0.35 -2.1 -1.5 -1.5 2.1 -0.3 z"/>
    <path d="M42 22 l0.9 1.9 2.1 0.3 -1.5 1.5 0.35 2.1 -1.9 -1 -1.9 1 0.35 -2.1 -1.5 -1.5 2.1 -0.3 z"/>
    <!-- ردوف پایین: ۳ ستاره -->
    <path d="M22 30 l0.9 1.9 2.1 0.3 -1.5 1.5 0.35 2.1 -1.9 -1 -1.9 1 0.35 -2.1 -1.5 -1.5 2.1 -0.3 z"/>
    <path d="M32 28 l0.9 1.9 2.1 0.3 -1.5 1.5 0.35 2.1 -1.9 -1 -1.9 1 0.35 -2.1 -1.5 -1.5 2.1 -0.3 z"/>
    <path d="M42 30 l0.9 1.9 2.1 0.3 -1.5 1.5 0.35 2.1 -1.9 -1 -1.9 1 0.35 -2.1 -1.5 -1.5 2.1 -0.3 z"/>
  </g>

  <!-- ─── سه کتاب (باز) ─── -->
  <g stroke="#F4E4BC" stroke-width="0.8" fill="none" stroke-linecap="round">
    <!-- کتاب چپ (کج به مرکز) -->
    <path d="M16 40 L26 34 L26 46 L16 50 Z" fill="#FFFFFF" opacity="0.92"/>
    <!-- خطوط صفحه‌ها کتاب چپ -->
    <line x1="19" y1="40" x2="25" y2="36.5"/>
    <line x1="19" y1="43" x2="25" y2="40"/>
    <line x1="19" y1="46" x2="25" y2="43"/>

    <!-- کتاب وسط (باز، دو صفحه) -->
    <path d="M26 34 L32 31 L38 34 L38 46 L32 43 L26 46 Z" fill="#FFFFFF" opacity="0.92"/>
    <!-- خط عمودی وسط کتاب وسط -->
    <line x1="32" y1="31" x2="32" y2="43"/>
    <!-- خطوط صفحه چپ -->
    <line x1="28" y1="36.5" x2="31" y2="35"/>
    <line x1="28" y1="39.5" x2="31" y2="38"/>
    <!-- خطوط صفحه راست -->
    <line x1="33" y1="35" x2="36" y2="36.5"/>
    <line x1="33" y1="38" x2="36" y2="39.5"/>

    <!-- کتاب راست (کج به مرکز) -->
    <path d="M48 40 L38 34 L38 46 L48 50 Z" fill="#FFFFFF" opacity="0.92"/>
    <!-- خطوط صفحه‌ها کتاب راست -->
    <line x1="39" y1="36.5" x2="45" y2="40"/>
    <line x1="39" y1="40" x2="45" y2="43"/>
    <line x1="39" y1="43" x2="45" y2="46"/>
  </g>

  <!-- ─── نوار VERITAS در پایین سپر ─── -->
  <path d="M14 50 L50 50 L48 56 L16 56 Z" fill="#F4E4BC" opacity="0.95"/>
  <text x="32" y="54.6" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="5.2" font-weight="700" fill="#A51C30" letter-spacing="0.6">VERITAS</text>
</svg>
