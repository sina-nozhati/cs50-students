{# Design Tokens + Base Styles — Single Source of Truth for both base.html and admin_base.html
   Include with: {% include "_partials/_design-tokens.html" %}
   UPDATE THIS FILE ONLY for design system changes.
#}
<style>
  :root {
    /* Harvard Crimson Palette (Light) */
    --crimson: #A51C30;
    --crimson-dark: #771020;
    --crimson-tint: #FBEAEE;

    /* Accent Colors */
    --gold: #C9A227;
    --success: #1E5631;
    --warning: #B7791F;
    --purple: #7C5CFC;
    --amber: #F59E0B;

    /* Neutrals - Surfaces & Texts */
    --canvas: #FAFAF7;
    --background: var(--canvas);
    --surface: #FFFFFF;
    --surface-raised: #FFFFFF;
    --surface-sunken: #F4F4F0;
    --ink: #1E1E1E;           /* Primary text - 11:1 on canvas ✅ */
    --foreground: var(--ink);
    --slate: #334155;         /* Secondary text - 4.8:1 on canvas ✅ */
    --slate-muted: #64748B;   /* Disabled/muted only */
    --border: #E2E0DA;
    --border-subtle: #F0EEEA;
    --border-focus: var(--crimson);

    /* Code & Syntax */
    --code-bg: #1E1E24;
    --code-text: #E2E8F0;

    /* Admin Sidebar */
    --admin-sidebar-bg: #1a1a2e;
    --admin-sidebar-text: #e0e0e0;
    --admin-sidebar-active: var(--crimson);
  }

  /* ─── Global Dark Mode (Design System Single Source of Truth) ─── */
  html.dark {
    --canvas: #121215;
    --background: var(--canvas);
    --surface: #1A1A1F;
    --surface-raised: #24242C;
    --surface-sunken: #151518;
    --ink: #F3F4F6;
    --foreground: var(--ink);
    --slate: #94A3B8;
    --slate-muted: #64748B;
    --border: #2B2B33;
    --border-subtle: #202026;
    --border-focus: #E03E52;

    /* Luminous Crimson for Dark Surfaces (WCAG AAA contrast) */
    --crimson: #E03E52;
    --crimson-dark: #B51D33;
    --crimson-tint: rgba(224, 62, 82, 0.16);

    --gold: #E5B83B;
    --success: #34D399;
    --warning: #FBBF24;
    --purple: #9D84FD;
    --amber: #FBBF24;

    --code-bg: #0D0D11;
    --code-text: #F1F5F9;

    --admin-sidebar-bg: #0E0E12;
    --admin-sidebar-text: #CBD5E1;
  }

  /* Global Reset & Typography Baseline */
  html {
    scroll-behavior: smooth;
    -webkit-text-size-adjust: 100%;
  }
  body {
    font-family: 'Vazirmatn', Tahoma, system-ui, sans-serif;
    background: var(--canvas);
    color: var(--ink);
    line-height: 1.6;
    -webkit-tap-highlight-color: transparent;
    transition: background-color .2s ease, color .2s ease;
  }

  /* Dark mode automatic surface & text overrides */
  html.dark .bg-white {
    background-color: var(--surface) !important;
  }
  html.dark .bg-canvas {
    background-color: var(--canvas) !important;
  }
  html.dark .bg-gray-50,
  html.dark .bg-gray-50\/50,
  html.dark .bg-gray-50\/60,
  html.dark .bg-gray-50\/75,
  html.dark .bg-gray-50\/80 {
    background-color: var(--surface-sunken) !important;
  }
  html.dark .bg-gray-100 {
    background-color: var(--surface-raised) !important;
  }
  html.dark .text-gray-900,
  html.dark .text-gray-800,
  html.dark .text-ink,
  html.dark .text-\[var\(--ink\)\] {
    color: var(--ink) !important;
  }
  html.dark .text-gray-700,
  html.dark .text-gray-600,
  html.dark .text-gray-500,
  html.dark .text-slate,
  html.dark .text-\[var\(--slate\)\] {
    color: var(--slate) !important;
  }
  html.dark .border-gray-100,
  html.dark .border-gray-200,
  html.dark .border-gray-300,
  html.dark .border-\[var\(--border\)\] {
    border-color: var(--border) !important;
  }
  html.dark .divide-gray-100 > :not([hidden]) ~ :not([hidden]),
  html.dark .divide-gray-200 > :not([hidden]) ~ :not([hidden]) {
    border-color: var(--border) !important;
  }

  /* Dark mode hover overrides (prevent white flash on hover) */
  html.dark .hover\:bg-gray-50:hover,
  html.dark .hover\:bg-gray-100:hover,
  html.dark .hover\:bg-gray-200:hover,
  html.dark .hover\:bg-slate-50:hover,
  html.dark .hover\:bg-slate-100:hover,
  html.dark .hover\:bg-white:hover {
    background-color: var(--surface-raised) !important;
  }
  html.dark .hover\:bg-red-50:hover {
    background-color: rgba(224, 62, 82, 0.16) !important;
  }
  html.dark .hover\:text-crimson:hover {
    color: var(--crimson) !important;
  }

  /* Spring tactile motion & mobile-native touch feedback */
  .spring-scale {
    transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.22s ease, background-color 0.15s ease, border-color 0.15s ease;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  @media (hover: hover) and (pointer: fine) {
    .spring-scale:hover {
      transform: translateY(-2px) scale(1.015);
    }
  }
  .spring-scale:active {
    transform: translateY(1px) scale(0.985);
  }

  /* Persian Numbers */
  .num { font-variant-numeric: tabular-nums; }

  /* ─── Button System ─── */
  .btn-crimson {
    background: var(--crimson);
    color: #fff;
    border-radius: 8px;
    font-weight: 600;
    min-height: 44px;                 /* WCAG 2.1 touch target */
    padding: 0.625rem 1.25rem;        /* 10px 20px */
    transition: background .15s ease, transform .1s ease, box-shadow .15s ease;
    box-shadow: 0 1px 2px rgba(58,10,18,.15);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    border: none;
    cursor: pointer;
    text-decoration: none;
    font-family: inherit;
    font-size: 0.875rem;              /* text-sm */
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-crimson:hover { background: var(--crimson-dark); }
  .btn-crimson:active { transform: scale(0.98); }
  .btn-crimson:focus-visible {
    outline: 2px solid var(--crimson);
    outline-offset: 2px;
  }
  .btn-crimson:disabled,
  .btn-crimson[aria-disabled="true"] {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .btn-outline-crimson {
    background: transparent;
    color: var(--crimson);
    border: 2px solid var(--crimson);
    border-radius: 8px;
    font-weight: 600;
    min-height: 44px;
    padding: 0.5rem 1.15rem;
    transition: background .15s ease, color .15s ease, transform .1s ease, border-color .15s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    cursor: pointer;
    text-decoration: none;
    font-family: inherit;
    font-size: 0.875rem;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-outline-crimson:hover {
    background: var(--crimson);
    color: #fff;
  }
  .btn-outline-crimson:active { transform: scale(0.98); }
  .btn-outline-crimson:focus-visible {
    outline: 2px solid var(--crimson);
    outline-offset: 2px;
  }

  .btn-soft-crimson {
    background: var(--crimson-tint);
    color: var(--crimson-dark);
    border: 1px solid rgba(165, 28, 48, 0.25);
    border-radius: 8px;
    font-weight: 600;
    min-height: 44px;
    padding: 0.5rem 1rem;
    transition: background .15s ease, color .15s ease, transform .1s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    cursor: pointer;
    font-size: 0.875rem;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    text-decoration: none;
  }
  .btn-soft-crimson:hover {
    background: rgba(165, 28, 48, 0.18);
    color: var(--crimson);
  }
  .btn-soft-crimson:active { transform: scale(0.98); }

  /* ─── Card System ─── */
  .card-harvard {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    transition: box-shadow .2s ease, border-color .2s ease, transform .2s ease;
  }
  .card-harvard:hover {
    box-shadow: 0 6px 18px -6px rgba(0,0,0,.12);
  }
  html.dark .card-harvard:hover {
    box-shadow: 0 8px 24px -4px rgba(0,0,0,.4);
  }
  .card-accent { border-right: 4px solid var(--crimson); }

  /* ─── Badge System ─── */
  .badge-crimson {
    background: var(--crimson-tint);
    color: var(--crimson);
    border-radius: 9999px;
    font-size: 0.75rem;       /* text-xs */
    font-weight: 600;
    padding: 2px 10px;
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
  }

  /* ─── Progress Bar ─── */
  .progress-track {
    background: #ece9e3;
    border-radius: 9999px;
    height: 10px;
    overflow: hidden;
  }
  .progress-fill {
    background: linear-gradient(90deg, var(--crimson), var(--crimson-dark));
    height: 100%;
    border-radius: 9999px;
    transition: width .5s ease;
  }

  /* ─── Focus Visible - UNIFIED (crimson, not gold) ─── */
  a:focus-visible,
  button:focus-visible,
  input:focus-visible,
  textarea:focus-visible,
  select:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid var(--crimson) !important;
    outline-offset: 2px;
    border-radius: 6px;
  }

  /* ─── Form Inputs ─── */
  .form-input {
    width: 100%;
    padding: 0.625rem 0.875rem;     /* 10px 14px */
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    min-height: 44px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    font-family: inherit;
    font-size: 0.875rem;
    color: var(--ink);
  }
  .form-input:focus {
    border-color: var(--crimson);
    box-shadow: 0 0 0 3px var(--crimson-tint);
    outline: none;
  }
  .form-input::placeholder { color: var(--slate-muted); }

  /* ─── Nav Link (top navbar) ─── */
  .nav-link {
    position: relative;
    padding: 0.5rem 0;
    font-weight: 500;
    color: var(--slate);
    transition: color .15s ease;
  }
  .nav-link:hover { color: var(--crimson); }
  .nav-link--active {
    color: var(--crimson);
    font-weight: 600;
  }
  .nav-link--active::after {
    content: '';
    position: absolute;
    bottom: -1px;
    right: 0;
    left: 0;
    height: 2px;
    background: var(--crimson);
    border-radius: 2px 2px 0 0;
  }

  /* ─── Bottom Nav (mobile) ─── */
  .bottom-nav-link {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    color: var(--slate);
    font-size: 0.625rem;        /* text-xs */
    font-weight: 500;
    transition: color .15s ease;
  }
  .bottom-nav-link--active {
    color: var(--crimson);
    font-weight: 700;
  }

  /* ─── Skip Link ─── */
  .skip-link {
    position: absolute;
    top: -100%;
    right: 1rem;
    z-index: 100;
    background: var(--crimson);
    color: #fff;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.875rem;
    text-decoration: none;
  }
  .skip-link:focus {
    top: 1rem;
  }

  /* ─── Scrollbar ─── */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(165,28,48,.25); border-radius: 9999px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(165,28,48,.4); }

  /* ─── RTL Helpers ─── */
  .me-auto { margin-inline-end: auto; }
  .ms-auto { margin-inline-start: auto; }
  .pe-4 { padding-inline-end: 1rem; }
  .ps-4 { padding-inline-start: 1rem; }

  /* ─── Utility: Cursor Pointer for Clickable ─── */
  .clickable { cursor: pointer; }
  .clickable:active { transform: scale(0.99); }

  /* ─── Loading Skeleton ─── */
  .skeleton {
    background: linear-gradient(90deg, var(--border) 25%, #f1efe9 50%, var(--border) 75%);
    background-size: 200% 100%;
    animation: skeleton-loading 1.5s infinite;
    border-radius: 8px;
  }
  @keyframes skeleton-loading {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ─── Print Styles ─── */
  @media print {
    .no-print { display: none !important; }
    .card-harvard { box-shadow: none; border-color: #ccc; }
  }

  /* ─── Knowledge Base (from design-system + Crimson brand lock) ─── */
  .kb-chip {
    display: inline-flex;
    align-items: center;
    padding: 0.25rem 0.75rem;
    border-radius: 9999px;
    font-size: 0.75rem;
    font-weight: 600;
    background: var(--crimson-tint);
    color: var(--crimson-dark);
    border: 1px solid rgba(165, 28, 48, 0.15);
  }
  .kb-section-title {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 1.125rem;
    font-weight: 700;
    margin-bottom: 1rem;
  }
  .kb-section-title::before {
    content: "";
    width: 0.35rem;
    height: 1.25rem;
    border-radius: 9999px;
    background: var(--crimson);
    flex-shrink: 0;
  }
  .kb-link-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.5rem 0.95rem;
    border-radius: 0.75rem;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    font-size: 0.875rem;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: border-color .2s ease, background .2s ease, color .2s ease, transform .15s ease;
  }
  .kb-link-chip:hover {
    border-color: var(--crimson);
    background: var(--crimson-tint);
    color: var(--crimson);
  }
  .kb-link-chip:active {
    transform: scale(0.97);
  }
  .kb-link-chip:focus-visible {
    outline: 2px solid var(--crimson);
    outline-offset: 2px;
  }
  .kb-code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.8rem;
    direction: ltr;
    text-align: left;
    background: #1E1E1E;
    color: #F5F5F5;
    padding: 0.5rem 0.75rem;
    border-radius: 0.5rem;
    display: block;
    overflow-x: auto;
  }
  .kb-choice-banner {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--warning);
    margin-bottom: 0.5rem;
  }
  @media (prefers-reduced-motion: reduce) {
    .kb-link-chip, .btn-crimson, .card-harvard { transition: none !important; }
  }

  /* KB prose — documentation reading experience */
  .kb-prose {
    font-size: 0.95rem;
    line-height: 1.75;
    color: var(--ink);
  }
  .kb-prose h1, .kb-prose h2, .kb-prose h3, .kb-prose h4 {
    font-weight: 700;
    margin-top: 1.5rem;
    margin-bottom: 0.75rem;
    color: var(--ink);
  }
  .kb-prose h2 { font-size: 1.25rem; border-bottom: 1px solid var(--border); padding-bottom: 0.35rem; }
  .kb-prose h3 { font-size: 1.1rem; color: var(--crimson-dark); }
  .kb-prose p, .kb-prose ul, .kb-prose ol { margin-bottom: 0.85rem; }
  .kb-prose ul, .kb-prose ol { padding-inline-start: 1.25rem; }
  .kb-prose a { color: var(--crimson); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
  .kb-prose a:hover { color: var(--crimson-dark); }
  /* ─── Code Display & Responsive UI Engineering (Universal) ─── */
  /* ۱. کدهای تک‌خطی (Inline Code): نشکن در عبور از عرض و بدون آسیب به ساختار متن فارسی */
  code:not(pre code),
  .kb-prose code:not(pre code) {
    font-family: 'Fira Code', 'JetBrains Mono', Menlo, Consolas, monospace !important;
    font-size: 0.86em !important;
    direction: ltr !important;
    text-align: left !important;
    unicode-bidi: isolate !important;
    background: var(--crimson-tint) !important;
    color: var(--crimson-dark) !important;
    border: 1px solid rgba(165, 28, 48, 0.15) !important;
    border-radius: 6px !important;
    padding: 0.12em 0.45em !important;
    margin: 0 0.18em !important;
    white-space: break-spaces !important;
    word-break: break-word !important;
    overflow-wrap: break-word !important;
    max-width: 100% !important;
    display: inline !important;
    vertical-align: baseline !important;
    line-height: 1.4 !important;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  html.dark code:not(pre code),
  html.dark .kb-prose code:not(pre code) {
    background: rgba(224, 62, 82, 0.14) !important;
    color: #FCA5A5 !important;
    border-color: rgba(224, 62, 82, 0.28) !important;
  }

  /* ۲. کدهای چندخطی خام و پایه‌ای قبل از ارتقا (Fallback Raw Pre) */
  pre, .kb-prose pre {
    direction: ltr !important;
    text-align: left !important;
    unicode-bidi: isolate !important;
    background: #18181B;
    color: #F1F5F9;
    padding: 1rem 1.1rem;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    overflow-x: auto;
    overscroll-behavior-x: contain;
    -webkit-overflow-scrolling: touch;
    margin: 1.25rem 0;
    font-size: 0.84rem;
    font-family: 'Fira Code', 'JetBrains Mono', Menlo, Consolas, monospace;
    line-height: 1.6;
    tab-size: 4;
    white-space: pre;
    max-width: 100% !important;
    min-width: 0 !important;
    box-sizing: border-box !important;
  }
  pre code, .kb-prose pre code {
    background: transparent !important;
    color: inherit !important;
    padding: 0 !important;
    border: none !important;
    font-family: inherit !important;
    font-size: inherit !important;
    white-space: inherit !important;
    direction: ltr !important;
  }

  /* ۳. فریم پیشرفته و واکنش‌گرای macOS برای بلوک‌های کد */
  .code-block-wrapper {
    position: relative;
    width: 100%;
    max-width: 100%;
    min-width: 0;
    margin: 1.25rem 0;
    border-radius: 14px;
    background: #18181B;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.28);
    overflow: hidden;
    direction: ltr !important;
    text-align: left !important;
    unicode-bidi: isolate;
    box-sizing: border-box;
  }
  html.dark .code-block-wrapper {
    background: #111114;
    border-color: rgba(255, 255, 255, 0.08);
    box-shadow: 0 6px 24px -2px rgba(0, 0, 0, 0.45);
  }

  .code-block-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 38px;
    padding: 0 0.85rem;
    background: #121215;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    user-select: none;
    -webkit-user-select: none;
    gap: 0.5rem;
  }
  html.dark .code-block-header {
    background: #0B0B0E;
  }

  .traffic-dots {
    display: flex;
    align-items: center;
    gap: 6px;
    shrink: 0;
  }
  .traffic-dot {
    width: 10.5px;
    height: 10.5px;
    border-radius: 50%;
    display: inline-block;
  }
  .dot-red { background: #FF5F56; border: 1px solid rgba(224, 68, 62, 0.6); }
  .dot-yellow { background: #FFBD2E; border: 1px solid rgba(222, 161, 35, 0.6); }
  .dot-green { background: #27C93F; border: 1px solid rgba(26, 171, 41, 0.6); }

  .code-info-pill {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    overflow: hidden;
  }
  .code-lang-tag {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: #A1A1AA;
    background: rgba(255, 255, 255, 0.06);
    padding: 0.15rem 0.55rem;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .code-lines-count {
    font-size: 0.68rem;
    font-weight: 600;
    color: #71717A;
    white-space: nowrap;
  }

  .code-actions {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    shrink: 0;
  }
  .code-action-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.22rem 0.6rem;
    border-radius: 8px;
    font-size: 0.72rem;
    font-weight: 600;
    color: #D4D4D8;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    min-height: 28px;
  }
  .code-action-btn:hover {
    background: rgba(255, 255, 255, 0.12);
    color: #FFFFFF;
    border-color: rgba(255, 255, 255, 0.2);
  }
  .code-action-btn:active {
    transform: scale(0.96);
  }
  .code-action-btn.active {
    background: rgba(0, 113, 227, 0.25);
    border-color: rgba(56, 189, 248, 0.5);
    color: #38BDF8;
  }
  .code-action-btn.copied {
