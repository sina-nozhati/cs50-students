{% extends "base.html" %}
{% block title %}آفلاین هستید{% endblock %}

{% block content %}
<div class="card-harvard p-8 text-center max-w-lg mx-auto my-12">
    <div class="w-16 h-16 bg-amber-50 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="1" y1="1" x2="23" y2="23"></line>
            <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
            <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
            <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
            <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
            <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
    </div>
    <h1 class="text-xl font-bold mb-2">اتصال اینترنت برقرار نیست</h1>
    <p class="text-[var(--slate)] text-sm mb-6">
        به نظر می‌رسد ارتباط شما با اینترنت قطع شده است. وقتی دوباره آنلاین شوید صفحات به صورت خودکار بارگذاری می‌شوند.
    </p>
    <button onclick="window.location.reload()" class="btn-crimson">
        تلاش مجدد
    </button>
</div>
{% endblock %}
